name: Araç Hasar Analizi Canlıya Alma (CI/CD)

on:
  push:
    branches:
      - master 

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Sunucuya Bağlan ve Güvenli Güncelleme Yap
        uses: appleboy/ssh-action@v1.0.3
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: GH_TOKEN
          script: |
            echo "--- 🚀 Araç Hasar Analizi Sunucusuna Bağlanıldı ---"
            
            # 1. Proje klasörüne git
            cd /home/yzhasartahmin/arac-hasar-analizi
            
            # 2. Güncel kodları çek (ZORLA EŞİTLE - Çakışmaları Önler)
            echo "--- 📦 GitHub'dan yeni kodlar çekiliyor ---"
            git fetch https://${GH_TOKEN}@github.com/everion-consulting/arac-hasar-analizi.git main
            git reset --hard FETCH_HEAD
            
            # 3. Docker'ı yeni kodlarla inşa et ve başlat (Orphan temizliği ile)
            echo "--- 🐳 Konteynerler Yeniden Başlatılıyor ---"
            docker compose up -d --build --remove-orphans
            
            # 4. Eski ve kullanılmayan imajları temizle (Sunucu şişmesin)
            echo "--- 🧹 Sistem temizliği yapılıyor ---"
            docker image prune -f
            
            echo "--- ✅ CI/CD Deployment Başarıyla Tamamlandı! ---"
