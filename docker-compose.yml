services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: hasar
      POSTGRES_USER: hasar
      POSTGRES_PASSWORD: hasar
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 15
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    restart: always
    # Container ayağa kalkarken önce migrate, sonra gunicorn çalışsın
    # WORKDIR Dockerfile'da /app/django_arac_hasar_backend olduğu için manage.py burada
    command: >
      sh -c "python manage.py migrate &&
             gunicorn django_arac_hasar_backend.wsgi:application --bind 0.0.0.0:8000"
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - ./staticfiles:/app/django_arac_hasar_backend/staticfiles
    environment:
      DJANGO_SETTINGS_MODULE: django_arac_hasar_backend.settings
      DJANGO_DEBUG: "False"
      DB_NAME: hasar
      DB_USER: hasar
      DB_PASSWORD: hasar
      DB_HOST: db
      DB_PORT: "5432"
      PREDICT_API_BEARER_TOKEN: ${PREDICT_API_BEARER_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:

